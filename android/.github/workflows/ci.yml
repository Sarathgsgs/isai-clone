name: Isai CI

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build, Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Detekt Static Analysis
        run: ./gradlew detekt || true

      - name: Run Android Lint
        run: ./gradlew lintDebug || true

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest || true

      - name: Assemble Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log || true
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            KOTLIN_ERRS=$(grep -E "^e: " build.log | head -n 15 | tr '\n' ' ' | cut -c 1-450)
            FAIL_ERR=$(grep -A 10 "What went wrong:" build.log | tr '\n' ' ' | cut -c 1-400)
            echo "::error title=KotlinErrors::$KOTLIN_ERRS"
            echo "::error title=WhatWentWrong::$FAIL_ERR"
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: isai-ci-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
