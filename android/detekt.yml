build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  active: true
  LongMethod:
    threshold: 80
  ComplexCondition:
    threshold: 4

naming:
  active: true
  FunctionNaming:
    functionPattern: '^([a-z][a-zA-Z0-9]*|[A-Z][a-zA-Z0-9]*)$' # Allow Compose @Composable naming

style:
  active: true
  MagicNumber:
    active: false # Colors and canvas coordinates often use numeric literals
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|preview.*)'

formatting:
  active: true
  android: true
  autoCorrect: true

