name: Build and Release Android APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Web Application
        run: |
          echo "=== Building React/Vite Web App ==="
          npm install --legacy-peer-deps --no-audit
          npm run build
          echo "=== Staging Web Assets for Android APK ==="
          mkdir -p android/app/src/main/assets/dist
          cp -r dist/* android/app/src/main/assets/dist/
          echo "Web application successfully bundled into android/app/src/main/assets/dist"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Gradle Project and Assemble APK
        run: |
          echo "=== Locating Gradle Project ==="
          if [ -f "./gradlew" ]; then
            GRADLE_DIR="."
          elif [ -f "./android/gradlew" ]; then
            GRADLE_DIR="./android"
          else
            GRADLE_DIR=$(find . -maxdepth 3 -name "gradlew" -not -path "*/.*" | head -n 1 | xargs -r dirname)
          fi

          if [ -z "$GRADLE_DIR" ] || [ ! -f "$GRADLE_DIR/gradlew" ]; then
            echo "::error::Could not find 'gradlew' in repository! Checked root and subdirectories."
            ls -la
            exit 1
          fi

          echo "Found Gradle project in: $GRADLE_DIR"
          cd "$GRADLE_DIR"

          echo "Granting executable permissions to gradlew..."
          chmod +x gradlew

          echo "Running assembleDebug..."
          set +e
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          set -e

          if [ $GRADLE_EXIT -ne 0 ]; then
            echo "=================================================="
            echo "::error::Gradle build failed with exit code $GRADLE_EXIT"
            echo "=================================================="

            KOTLIN_ERRORS=$(grep -E "^e: " build.log || true)

            echo "### ❌ Build Failure Summary" >> $GITHUB_STEP_SUMMARY
            if [ -n "$KOTLIN_ERRORS" ]; then
              echo "#### Kotlin Compilation Errors:" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$KOTLIN_ERRORS" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY

              while IFS= read -r line; do
                if [[ $line == e:* ]]; then
                  echo "::error::$line"
                fi
              done <<< "$KOTLIN_ERRORS"
            else
              FAIL_SECTION=$(grep -A 30 "What went wrong:" build.log || tail -n 60 build.log)
              echo "#### Error Output:" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$FAIL_SECTION" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi

            echo ""
            echo "=== Detailed compilation logs before failure ==="
            grep -B 5 -A 20 -E "(compileDebugKotlin|kspDebugKotlin|Compilation error)" build.log | head -n 150 || tail -n 120 build.log
            exit $GRADLE_EXIT
          fi

          echo "=== Locating Built APK ==="
          APK_PATH=$(find . -type f -name "*debug*.apk" -o -name "app-debug.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "::error::assembleDebug completed but no APK was found in build outputs."
            exit 1
          fi

          echo "Found APK at: $GRADLE_DIR/$APK_PATH"
          mkdir -p "$GITHUB_WORKSPACE/outputs"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/outputs/app-debug.apk"
          echo "APK successfully staged at $GITHUB_WORKSPACE/outputs/app-debug.apk"
          echo "### ✅ Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "APK generated: \`outputs/app-debug.apk\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Isai-v1.4.0-Debug-APK
          path: outputs/app-debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: 'v1.4.0'
          name: 'Isai Music Player v1.4.0'
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🎵 Isai Music Player v1.4.0 Release

            ### ✨ What's New in v1.4.0:
            1. **Crystal-Clear Hardware Audio Playback**: Direct Media3 ExoPlayer integration ensures 100% audible playback without WebView audio pipeline silences.
            2. **Real ID3 Metadata & Embedded Album Artwork**: Full tag extraction for Track Title, Artist, Album, and embedded cover art displayed directly on the spinning vinyl platter.
            3. **Clean Installation & First-Time Onboarding**: Mock demo tracks removed. Starts clean with an automated prompt to select your local music directory.
            4. **Official Isai Splash Screen**: Updated dark splash screen featuring the official high-resolution Isai logo emblem.
            5. **360° Circular Turntable Scratching**: True vinyl disc scratching—spin clockwise to seek forward and counter-clockwise to rewind.
            6. **Samsung Music Style Media Notification**: Rich system notification with playback controls (Play/Pause/Next/Prev), track artwork, and lock screen seekbar.
            7. **Comfortable Top Bar Spacing**: Lowered top action headers in library and NowPlaying views with generous clearance from phone notch, camera cutout, clock, and status bar icons.

            ### 📲 How to Install:
            1. Download `app-debug.apk` directly on your Android device below.
            2. Tap the file to install (allow "Install unknown apps" if prompted).
            3. Tap **Select Music Folder** on first launch and enjoy your offline music!
          files: outputs/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
